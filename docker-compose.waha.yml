# WAHA (WhatsApp HTTP API) untuk demo WhatsApp Kala. Lihat docs/waha.md.
#   docker compose -f docker-compose.waha.yml up -d
services:
  waha:
    image: devlikeapro/waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-kawalhalal-waha}
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_API_KEY:-kawalhalal-waha}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_API_KEY:-kawalhalal-waha}
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_START_SESSION: default
      WHATSAPP_DOWNLOAD_MEDIA: "true"
      WHATSAPP_HOOK_URL: http://host.docker.internal:8010/api/waha/webhook
      WHATSAPP_HOOK_EVENTS: message
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./.waha/sessions:/app/.sessions
      - ./.waha/media:/app/.media
